{% extends "base.html" %}

{% block title %}Edit Planting - Gartenplanner{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Edit Planting</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label for="variety_id">Variety *</label>
        <select id="variety_id" name="variety_id" required>
            {% for variety in varieties %}
            <option value="{{ variety.id }}" {% if variety.id == planting.variety_id %}selected{% endif %}>
                {{ variety.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="year">Year *</label>
        <input type="number" id="year" name="year" min="1900" max="2100" required value="{{ planting.year }}">
    </div>

    <div class="form-group">
        <label for="quantity">Quantity *</label>
        <input type="number" id="quantity" name="quantity" min="1" required value="{{ planting.quantity }}">
    </div>

    <div class="form-group">
        <label for="planting_date">Planting Date *</label>
        <input type="date" id="planting_date" name="planting_date" required value="{{ planting.planting_date.strftime('%Y-%m-%d') }}">
    </div>

    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3">{{ planting.notes or '' }}</textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Update Planting</button>
        <a href="{{ url_for('plantings_list') }}" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
