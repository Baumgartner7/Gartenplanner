{% extends "base.html" %}

{% block title %}Add Harvest - Gartenplanner{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Add Harvest</h1>
    <p>For planting: <a href="{{ url_for('planting_detail', id=planting.id) }}">{{ planting.variety.name }} ({{ planting.year }})</a></p>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label for="first_harvest_date">First Harvest Date *</label>
        <input type="date" id="first_harvest_date" name="first_harvest_date" required>
    </div>

    <div class="form-group">
        <label for="last_harvest_date">Last Harvest Date</label>
        <input type="date" id="last_harvest_date" name="last_harvest_date">
    </div>

    <div class="form-group">
        <label for="quantity_harvested">Quantity Harvested (e.g., "5 kg")</label>
        <input type="text" id="quantity_harvested" name="quantity_harvested" maxlength="200">
    </div>

    <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3"></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Record Harvest</button>
        <a href="{{ url_for('planting_detail', id=planting.id) }}" class="btn">Cancel</a>
    </div>
</form>
{% endblock %}
