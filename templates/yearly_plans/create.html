{% extends "base.html" %}

{% block title %}Create Yearly Plan - Gartenplanner{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Create Yearly Plan Entry</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label for="year">Year:</label>
        <input type="number" name="year" id="year" min="2020" max="2100" value="{{ selected_year or '' }}" required>
    </div>

    <div class="form-group">
        <label for="variety_id">Variety:</label>
        <select name="variety_id" id="variety_id" required>
            <option value="">Select a variety...</option>
            {% for variety in varieties %}
            <option value="{{ variety.id }}">{{ variety.name }} ({{ variety.plant_family or 'No family' }})</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="planned_quantity">Planned Quantity:</label>
        <input type="number" name="planned_quantity" id="planned_quantity" min="1" required>
    </div>

    <div class="form-group">
        <label for="planned_sowing_date">Planned Sowing Date (optional):</label>
        <input type="date" name="planned_sowing_date" id="planned_sowing_date">
        <small>Leave empty to use auto-calculated date from variety's optimal sowing months</small>
    </div>

    <div class="form-group">
        <label for="status">Status:</label>
        <select name="status" id="status">
            <option value="draft" selected>Draft</option>
            <option value="finalized">Finalized</option>
        </select>
    </div>

    <div class="form-group">
        <label for="notes">Notes (optional):</label>
        <textarea name="notes" id="notes" rows="4"></textarea>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Plan</button>
        <a href="{{ url_for('plan_year', year=selected_year or datetime.now().year) }}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
